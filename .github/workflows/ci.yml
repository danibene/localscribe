name: tests

on:
  push:
    branches: [main]
    tags: ['v[0-9]*', '[0-9]+.[0-9]+*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1,16 * *'

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref_type }}-
    ${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      wheel-distribution: ${{ steps.wheel-distribution.outputs.path }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        id: setup-python
        with:
          python-version: "3.12"

      - name: Run static analysis and format checkers
        run: pipx run pre-commit run --all-files --show-diff-on-failure

      - name: Install tox
        run: python -m pip install --upgrade pip "tox==4.24.2"

      - name: Build package distribution files
        run: python -m tox -e clean,build

      - name: Record the path of wheel distribution
        id: wheel-distribution
        shell: bash
        run: echo "path=$(ls dist/*.whl)" >> "$GITHUB_OUTPUT"

      - name: Store the distribution files for use in other stages
        uses: actions/upload-artifact@v4
        with:
          name: python-distribution-files
          path: dist/
          retention-days: 1

  test:
    needs: prepare
    strategy:
      matrix:
        python:
          - "3.8"
          - "3.12"
        platform:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        id: setup-python
        with:
          python-version: ${{ matrix.python }}

      - name: Retrieve pre-built distribution files
        uses: actions/download-artifact@v4
        with:
          name: python-distribution-files
          path: dist/

      - name: Install tox
        run: python -m pip install --upgrade pip "tox==4.24.2"

      - name: Run tests
        run: >-
          python -m tox
          --installpkg "${{ needs.prepare.outputs.wheel-distribution }}"
          -- -rFEx --durations 10 --color yes

      - name: Generate coverage report
        run: pipx run coverage lcov -o coverage.lcov

      - name: Upload partial coverage report
        uses: coverallsapp/github-action@master
        with:
          path-to-lcov: coverage.lcov
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: ${{ matrix.platform }} - py${{ matrix.python }}
          parallel: true

  pyinstaller-build:
    strategy:
      matrix:
        platform:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Create .venv
        run: python -m venv .venv

      - name: Resolve venv python
        id: venv-python
        shell: bash
        run: |
          if [ -x ".venv/bin/python" ]; then
            echo "path=.venv/bin/python" >> "$GITHUB_OUTPUT"
          else
            echo "path=.venv/Scripts/python.exe" >> "$GITHUB_OUTPUT"
          fi

      - name: Install package and build tools
        run: >-
          ${{ steps.venv-python.outputs.path }} -m pip install --upgrade pip &&
          ${{ steps.venv-python.outputs.path }} -m pip install -e . pyinstaller

      - name: Verify FFmpeg is available for bundling
        run: >-
          ${{ steps.venv-python.outputs.path }} -c "from localscribe.packaging import get_source_ffmpeg_binary; print(get_source_ffmpeg_binary())"

      - name: Preload Whisper model cache
        run: >-
          ${{ steps.venv-python.outputs.path }} -m localscribe.skeleton
          --download-model --model-name base

      - name: Create Executable
        run: >-
          ${{ steps.venv-python.outputs.path }} -m PyInstaller
          --clean --noconfirm gui.spec

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: localscribe-gui-${{ matrix.platform }}
          path: dist/

  finalize:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Finalize coverage report
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true

  publish:
    needs: finalize
    if: ${{ github.event_name == 'push' && contains(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Retrieve pre-built distribution files
        uses: actions/download-artifact@v4
        with:
          name: python-distribution-files
          path: dist/

      - name: Install tox
        run: python -m pip install --upgrade pip "tox==4.24.2"

      - name: Publish Package
        env:
          TWINE_REPOSITORY: pypi
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: python -m tox -e publish
