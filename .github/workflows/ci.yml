name: tests

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - '*.*.*'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1,16 * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_type }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
# =========================
# PREPARE (build package)
# =========================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      wheel-distribution: ${{ steps.wheel.outputs.path }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.11"

      - name: Install pipx
        run: python -m pip install --upgrade pipx

      - name: Run static analysis
        run: pipx run pre-commit run --all-files --show-diff-on-failure

      - name: Build package
        run: pipx run --python '${{ steps.setup-python.outputs.python-path }}' tox -e clean,build

      - name: Record wheel path
        id: wheel
        run: echo "path=$(ls dist/*.whl)" >> $GITHUB_OUTPUT

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: python-distribution-files
          path: dist/
          retention-days: 1

# =========================
# TEST MATRIX
# =========================
  test:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        # 3.7 is EOL and no longer available on ubuntu-latest.
        python: ["3.8", "3.11"]
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: ${{ matrix.python }}

      - name: Install pipx
        run: python -m pip install --upgrade pipx

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: python-distribution-files
          path: dist/

      - name: Run tests
        run: pipx run --python '${{ steps.setup-python.outputs.python-path }}' tox --installpkg '${{ needs.prepare.outputs.wheel-distribution }}' -- -rFEx --durations 10 --color yes

      - name: Coverage report
        run: pipx run coverage lcov -o coverage.lcov

      - name: Upload coverage
        uses: coverallsapp/github-action@v2
        with:
          path-to-lcov: coverage.lcov
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: ${{ matrix.platform }} - py${{ matrix.python }}
          parallel: true

# =========================
# PYINSTALLER BUILD
# =========================
  pyinstaller-build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv (Unix)
        if: runner.os != 'Windows'
        run: python -m venv .venv

      - name: Install deps + build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          # Keep the runner disk usage under control.
          # Installing torch from PyPI on Linux may pull large CUDA wheels (nvidia-*),
          # which can easily exhaust the GitHub runner disk.
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install --no-cache-dir \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            torch==2.10.0

          python -m pip install --no-cache-dir -e .
          python -m pip install --no-cache-dir -r src/requirements.txt
          python -m pip install pyinstaller

          python -c "from localscribe.skeleton import download_model; download_model()"
          WHISPER_PATH=$(python -c "import whisper, os; print(os.path.join(os.path.dirname(whisper.__file__), 'assets'))")

          pyinstaller src/gui.py \
            --onefile \
            --windowed \
            --hidden-import whisper \
            --add-data "${WHISPER_PATH}:whisper/assets" \
            --clean \
            --noconfirm

      - name: Upload executable (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: localscribe-${{ runner.os }}
          path: dist/*

      - name: Create venv (Windows)
        if: runner.os == 'Windows'
        run: python -m venv .venv

      - name: Install deps + build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\.venv\Scripts\Activate.ps1
          # Same idea as Unix: use the CPU torch wheels to avoid huge CUDA downloads.
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install --no-cache-dir `
            --index-url https://download.pytorch.org/whl/cpu `
            --extra-index-url https://pypi.org/simple `
            torch==2.10.0

          python -m pip install --no-cache-dir -e .
          python -m pip install --no-cache-dir -r src/requirements.txt
          python -m pip install pyinstaller

          python -c "from localscribe.skeleton import download_model; download_model()"
          $whisperPath = python -c "import whisper, os; print(os.path.join(os.path.dirname(whisper.__file__), 'assets'))"

          pyinstaller src\gui.py `
            --onefile `
            --windowed `
            --hidden-import whisper `
            --add-data "$whisperPath;whisper/assets" `
            --clean `
            --noconfirm

      - name: Upload executable (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: localscribe-${{ runner.os }}
          path: dist/*

# =========================
# FINALIZE COVERAGE
# =========================
  finalize:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Finalize coverage
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true

# =========================
# PUBLISH
# =========================
  publish:
    needs: finalize
    if: ${{ github.event_name == 'push' && contains(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: python-distribution-files
          path: dist/

      - name: Install pipx
        run: python -m pip install --upgrade pipx

      - name: Publish to PyPI
        env:
          TWINE_REPOSITORY: pypi
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: pipx run tox -e publish