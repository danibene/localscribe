name: tests

on:
  push:
    branches: [main]
    tags: ['v[0-9]*', '[0-9]+.[0-9]+*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1,16 * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_type }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
# =========================
# PREPARE (build package)
# =========================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      wheel-distribution: ${{ steps.wheel.outputs.path }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.11"

      - name: Install pipx
        run: python -m pip install --upgrade pipx

      - name: Run static analysis
        run: pipx run pre-commit run --all-files --show-diff-on-failure

      - name: Build package
        run: pipx run --python '${{ steps.setup-python.outputs.python-path }}' tox -e clean,build

      - name: Record wheel path
        id: wheel
        run: echo "path=$(ls dist/*.whl)" >> $GITHUB_OUTPUT

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: python-distribution-files
          path: dist/
          retention-days: 1

# =========================
# TEST MATRIX
# =========================
  test:
    needs: prepare
    strategy:
      matrix:
        python: ["3.7", "3.11"]
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: ${{ matrix.python }}

      - name: Install pipx
        run: python -m pip install --upgrade pipx

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: python-distribution-files
          path: dist/

      - name: Run tests
        run: pipx run --python '${{ steps.setup-python.outputs.python-path }}' tox --installpkg '${{ needs.prepare.outputs.wheel-distribution }}' -- -rFEx --durations 10 --color yes

      - name: Coverage report
        run: pipx run coverage lcov -o coverage.lcov

      - name: Upload coverage
        uses: coverallsapp/github-action@master
        with:
          path-to-lcov: coverage.lcov
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: ${{ matrix.platform }} - py${{ matrix.python }}
          parallel: true

# =========================
# PYINSTALLER BUILD
# =========================
  pyinstaller-build:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install package (Unix)
        if: runner.os != 'Windows'
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e .
          .venv/bin/pip install -r src/requirements.txt
          .venv/bin/getwhispermodel

      - name: Install package (Windows)
        if: runner.os == 'Windows'
        run: |
          .venv\Scripts\pip.exe install --upgrade pip
          .venv\Scripts\pip.exe install -e .
          .venv\Scripts\pip.exe install -r src/requirements.txt
          .venv\Scripts\getwhispermodel.exe

      - name: Build executable
        uses: sayyid5416/pyinstaller@v1
        with:
          python_ver: '3.11'
          spec: 'src/gui.py'
          upload_exe_with_name: 'My executable ${{ matrix.platform }}'
          options: --onefile, --name "My App ${{ matrix.platform }}", --windowed

# =========================
# FINALIZE COVERAGE
# =========================
  finalize:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Finalize coverage
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true

# =========================
# PUBLISH
# =========================
  publish:
    needs: finalize
    if: ${{ github.event_name == 'push' && contains(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: python-distribution-files
          path: dist/

      - name: Install pipx
        run: python -m pip install --upgrade pipx

      - name: Publish to PyPI
        env:
          TWINE_REPOSITORY: pypi
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: pipx run tox -e publish
